name: Fortress stream cipher state zeroization

on:
  push:
    branches:
      - fortress/persistent-value-zeroization

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fortress/persistent-value-zeroization
      - name: Enable RustCrypto zeroize features
        shell: python
        run: |
          from pathlib import Path
          p = Path('Cargo.toml')
          s = p.read_text()
          replacements = {
              'salsa20 = "0.11"': 'salsa20 = { version = "0.11", features = ["zeroize"] }',
              'chacha20 = "0.10"': 'chacha20 = { version = "0.10", features = ["zeroize"] }',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'expected dependency line missing: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Refresh lockfile
        run: cargo update -p salsa20 -p chacha20
      - name: Remove helper workflow
        run: rm .github/workflows/fortress-stream-state-zeroize-temp.yml
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.toml Cargo.lock .github/workflows/fortress-stream-state-zeroize-temp.yml
          git commit -m "fix: zeroize stream cipher state on drop"
          git push origin HEAD:fortress/persistent-value-zeroization