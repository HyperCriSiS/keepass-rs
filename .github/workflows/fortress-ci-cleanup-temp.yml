name: Fortress CI cleanup (temporary)

on:
  push:
    branches:
      - fortress/bounded-ci-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message != 'chore: apply fork CI cleanup'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Get Nix version
        id: nix-version
        run: echo "version=$(cat .nix-version)" >> "$GITHUB_OUTPUT"

      - name: Install Nix
        uses: cachix/install-nix-action@1ca7d21a94afc7c957383a2d217460d980de4934
        with:
          install_url: https://releases.nixos.org/nix/nix-${{ steps.nix-version.outputs.version }}/install

      - name: Apply semantic cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          open_path = Path("src/db/open.rs")
          text = open_path.read_text()
          old = '''    #[error("database input exceeds configured limit of {limit} bytes")]
              InputBytes { limit: usize },

              #[error("decompressed database payload exceeds configured limit of {limit} bytes")]
              DecompressedPayloadBytes { limit: usize },

              #[error("decompressed binary exceeds configured limit of {limit} bytes")]
              DecompressedBinaryBytes { limit: usize },

              #[error("total decompressed binary data exceeds configured limit of {limit} bytes")]
              TotalDecompressedBinaryBytes { limit: usize },'''.replace("              ", "    ")
          new = '''    /// The encoded database input exceeded the configured byte limit.
              #[error("database input exceeds configured limit of {limit} bytes")]
              InputBytes {
                  /// Maximum permitted encoded input size in bytes.
                  limit: usize,
              },

              /// The decompressed KDBX payload exceeded the configured byte limit.
              #[error("decompressed database payload exceeds configured limit of {limit} bytes")]
              DecompressedPayloadBytes {
                  /// Maximum permitted decompressed KDBX payload size in bytes.
                  limit: usize,
              },

              /// A decoded/decompressed binary attachment exceeded the configured byte limit.
              #[error("decompressed binary exceeds configured limit of {limit} bytes")]
              DecompressedBinaryBytes {
                  /// Maximum permitted size of one decoded/decompressed binary attachment in bytes.
                  limit: usize,
              },

              /// Aggregate decoded/decompressed binary data exceeded the configured byte limit.
              #[error("total decompressed binary data exceeds configured limit of {limit} bytes")]
              TotalDecompressedBinaryBytes {
                  /// Maximum permitted aggregate decoded/decompressed binary size in bytes.
                  limit: usize,
              },'''.replace("              ", "    ")
          if text.count(old) != 1:
              raise SystemExit("resource-limit enum block did not match exactly once")
          open_path.write_text(text.replace(old, new))

          xml_path = Path("src/format/xml_db/mod.rs")
          text = xml_path.read_text()
          start = text.find("pub fn parse_xml(")
          end = text.find("pub(crate) fn parse_xml_with_limits", start)
          if start < 0 or end < 0:
              raise SystemExit("legacy parse_xml wrapper not found")
          xml_path.write_text(text[:start] + text[end:])
          PY

      - name: Format with fork toolchain
        run: nix develop --command cargo fmt

      - name: Validate formatted tree
        run: |
          nix develop --command cargo fmt --check
          git diff --check

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "HyperCriSiS"
          git config user.email "dev.github@w3b.world"
          git add src/compression.rs src/db/mod.rs src/db/open.rs src/format/kdbx3.rs src/format/kdbx4/parse.rs src/format/xml_db/mod.rs
          git commit -m "chore: apply fork CI cleanup"
          git push origin HEAD:fortress/bounded-ci-cleanup