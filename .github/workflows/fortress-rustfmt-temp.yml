name: Fortress memory hygiene rustfmt

on:
  push:
    branches:
      - fortress/persistent-value-zeroization

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fortress/persistent-value-zeroization
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format touched Rust files
        run: cargo fmt -- src/format/hmac_block_stream.rs src/format/kdbx3.rs src/format/kdbx4/parse.rs src/db/types/value.rs
      - name: Remove helper
        run: rm .github/workflows/fortress-rustfmt-temp.yml
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/format/hmac_block_stream.rs src/format/kdbx3.rs src/format/kdbx4/parse.rs src/db/types/value.rs .github/workflows/fortress-rustfmt-temp.yml
          git commit -m "style: format memory hygiene patch"
          git push origin HEAD:fortress/persistent-value-zeroization