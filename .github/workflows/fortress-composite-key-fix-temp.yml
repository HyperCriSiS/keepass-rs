name: Fortress composite key contract fix

on:
  push:
    branches:
      - fortress/persistent-value-zeroization

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fortress/persistent-value-zeroization
      - name: Preserve KDF composite-key contract
        shell: python
        run: |
          from pathlib import Path

          replacements = [
              (
                  Path('src/format/kdbx4/parse.rs'),
                  'let composite_key = Zeroizing::new(crypt::calculate_sha256(&key_elements).as_slice().to_vec());',
                  'let composite_key = crypt::calculate_sha256(&key_elements);',
              ),
              (
                  Path('src/format/kdbx3.rs'),
                  'let composite_key = Zeroizing::new(calculate_sha256(&key_elements).as_slice().to_vec());',
                  'let composite_key = calculate_sha256(&key_elements);',
              ),
          ]
          for path, old, new in replacements:
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'expected pattern missing in {path}')
              path.write_text(text.replace(old, new, 1))
      - name: Remove helper workflow
        run: rm .github/workflows/fortress-composite-key-fix-temp.yml
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/format/kdbx4/parse.rs src/format/kdbx3.rs .github/workflows/fortress-composite-key-fix-temp.yml
          git commit -m "fix: preserve KDF composite key contract"
          git push origin HEAD:fortress/persistent-value-zeroization