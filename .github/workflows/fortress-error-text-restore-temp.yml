name: Fortress KDBX4 error text restore

on:
  push:
    branches:
      - fortress/persistent-value-zeroization

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fortress/persistent-value-zeroization
      - name: Restore existing error text
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/format/kdbx4/parse.rs')
          s = p.read_text()
          old = '#[error("Unexpected end of file")]\n    UnexpectedEof,'
          new = '#[error("Unexpected end of file while parsing inner header")]\n    UnexpectedEof,'
          if old not in s:
              raise SystemExit('expected KDBX4 error text not found')
          p.write_text(s.replace(old, new, 1))
      - name: Remove helper
        run: rm .github/workflows/fortress-error-text-restore-temp.yml
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/format/kdbx4/parse.rs .github/workflows/fortress-error-text-restore-temp.yml
          git commit -m "fix: preserve KDBX4 error text"
          git push origin HEAD:fortress/persistent-value-zeroization