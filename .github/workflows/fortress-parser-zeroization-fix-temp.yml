name: Fortress parser zeroization type fix

on:
  push:
    branches:
      - fortress/persistent-value-zeroization

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fortress/persistent-value-zeroization
      - name: Apply zeroizing byte-owner fix
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/format/kdbx4/parse.rs')
          s = p.read_text()
          s = s.replace(
              'let composite_key = Zeroizing::new(crypt::calculate_sha256(&key_elements));',
              'let composite_key = Zeroizing::new(crypt::calculate_sha256(&key_elements).as_slice().to_vec());',
          )
          s = s.replace(
              '''let transformed_key = Zeroizing::new(\n        outer_header\n            .kdf_config\n            .get_kdf_seeded(&outer_header.kdf_seed)\n            .transform_key(&composite_key)?,\n    );''',
              '''let transformed_key = Zeroizing::new(\n        outer_header\n            .kdf_config\n            .get_kdf_seeded(&outer_header.kdf_seed)\n            .transform_key(&composite_key)?\n            .as_slice()\n            .to_vec(),\n    );''',
          )
          s = s.replace(
              '''let master_key = Zeroizing::new(crypt::calculate_sha256(&[\n        outer_header.master_seed.as_ref(),\n        &transformed_key,\n    ]));''',
              '''let master_key = Zeroizing::new(\n        crypt::calculate_sha256(&[outer_header.master_seed.as_ref(), &transformed_key])\n            .as_slice()\n            .to_vec(),\n    );''',
          )
          s = s.replace(
              '''let hmac_key = Zeroizing::new(crypt::calculate_sha512(&[\n        &outer_header.master_seed,\n        &transformed_key,\n        &hmac_block_stream::HMAC_KEY_END,\n    ]));''',
              '''let hmac_key = Zeroizing::new(\n        crypt::calculate_sha512(&[\n            &outer_header.master_seed,\n            &transformed_key,\n            &hmac_block_stream::HMAC_KEY_END,\n        ])\n        .as_slice()\n        .to_vec(),\n    );''',
          )
          p.write_text(s)

          p = Path('src/format/kdbx3.rs')
          s = p.read_text()
          s = s.replace(
              'let composite_key = Zeroizing::new(calculate_sha256(&key_elements));',
              'let composite_key = Zeroizing::new(calculate_sha256(&key_elements).as_slice().to_vec());',
          )
          s = s.replace(
              '''let transformed_key = Zeroizing::new(\n        config\n            .kdf_config\n            .get_kdf_seeded(&header.transform_seed)\n            .transform_key(&composite_key)?,\n    );''',
              '''let transformed_key = Zeroizing::new(\n        config\n            .kdf_config\n            .get_kdf_seeded(&header.transform_seed)\n            .transform_key(&composite_key)?\n            .as_slice()\n            .to_vec(),\n    );''',
          )
          s = s.replace(
              '''let master_key = Zeroizing::new(calculate_sha256(&[\n        header.master_seed.as_ref(),\n        &transformed_key,\n    ]));''',
              '''let master_key = Zeroizing::new(\n        calculate_sha256(&[header.master_seed.as_ref(), &transformed_key])\n            .as_slice()\n            .to_vec(),\n    );''',
          )
          p.write_text(s)

          p = Path('src/format/hmac_block_stream.rs')
          s = p.read_text()
          s = s.replace('use hybrid_array::{typenum::U64, Array as GenericArray};\n', '')
          s = s.replace(
              '''pub(crate) fn read_hmac_block_stream(\n    data: &[u8],\n    key: &GenericArray<u8, U64>,\n) -> Result<Vec<u8>, BlockStreamError> {''',
              '''pub(crate) fn read_hmac_block_stream(\n    data: &[u8],\n    key: &[u8],\n) -> Result<Vec<u8>, BlockStreamError> {''',
          )
          s = s.replace(
              'pub(crate) fn write_hmac_block_stream(data: &[u8], key: &GenericArray<u8, U64>) -> Vec<u8> {',
              'pub(crate) fn write_hmac_block_stream(data: &[u8], key: &[u8]) -> Vec<u8> {',
          )
          s = s.replace(
              'pub(crate) fn get_hmac_block_key(block_index: u64, key: &GenericArray<u8, U64>) -> Zeroizing<Vec<u8>> {',
              'pub(crate) fn get_hmac_block_key(block_index: u64, key: &[u8]) -> Zeroizing<Vec<u8>> {',
          )
          p.write_text(s)
      - name: Remove helper workflow
        run: rm .github/workflows/fortress-parser-zeroization-fix-temp.yml
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/format/kdbx4/parse.rs src/format/kdbx3.rs src/format/hmac_block_stream.rs .github/workflows/fortress-parser-zeroization-fix-temp.yml
          git commit -m "fix: store parser keys in zeroizing byte owners"
          git push origin HEAD:fortress/persistent-value-zeroization