[package]
name = "keepass"
version = "0.13.18"
authors = ["Eugene Ovidiu Panaitescu <ovi.panaitescu@gmail.com>"]
edition = "2021"
license = "MIT"
description = "KeePass .kdbx database file parser"
repository = "https://github.com/sseemayer/keepass-rs"
documentation = "https://docs.rs/keepass"
readme = "README.md"
keywords = ["keepass", "kdb", "kdbx", "password", "database"]
categories = ["parsing", "authentication", "cryptography"]
exclude = ["assets/*", "tests/resources/*"]
rust-version = "1.85.0"

[package.metadata.docs.rs]
features = ["challenge_response", "save_kdbx4", "serialization", "totp", "utilities"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
utilities = ["anyhow", "clap", "rpassword", "serialization", "totp"]
serialization = ["serde_json", "chrono/serde"]
totp = ["totp-lite", "url", "base32"]
save_kdbx4 = []
challenge_response = ["sha1", "nusb", "dep:challenge_response"]

# by default, features "serialization" and "totp" are enabled
# change this to `default = []` in your Cargo.toml to disable all default features
default = []

[dependencies]
thiserror = "2"

# encoding and parsing
byteorder = "1"
flate2 = "1"
base64 = "0.23"
serde = { version = "1",  features = ["derive"] }
serde_ignored = "0.1.14"
quick-xml = { version = "0.41", features = ["serialize"] }
hex-literal = "1"
secrecy = "0.10.3"
chrono = { version = "0.4.23", default-features = false, features = [
    "serde",
    "clock",
    "std",
] }

# cryptography
rust-argon2 = "3.0"
sha1 = { version = "0.11", optional = true }
sha2 = "0.11"
aes = "0.9"
block-modes = "0.9"
chacha20 = "0.10"
salsa20 = "0.11"
twofish = "0.8"
hmac = "0.13"
rand = "0.10"

# utilities
anyhow = { version = "1", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
rpassword = { version = "7", optional = true }

# totp
base32 = { version = "0.5", optional = true }
totp-lite = { version = "2", optional = true }
url = { version = "2", optional = true }

# challenge-response
nusb = { version = "0.2.0", optional = true }
challenge_response = { version = "0.5", optional = true, default-features = false, features = ["nusb"] }

uuid = { version = "1.18.1", features = ["v4", "serde"] }
indexmap = { version = "2", features = ["serde"] }
hex = { version = "0.4" }
hybrid-array = "0.4"

[dev-dependencies]
hex-literal = "1"
tempfile = "3"

# dependencies for serialization (enabled by "serialization" feature)
serde_json = { version = "1", optional = true }

# dependencies for totp (enabled by "totp" feature)

# dependencies for command line utilities (enabled by "utilities" feature)

[[bin]]
name = "kp-dump-json"
required-features = ["utilities"]

[[bin]]
name = "kp-get-version"
required-features = ["utilities"]

[[bin]]
name = "kp-rewrite"
required-features = ["utilities", "save_kdbx4"]

[[bin]]
name = "kp-purge-history"
required-features = ["utilities", "save_kdbx4"]

[[bin]]
name = "kp-merge"
required-features = ["utilities", "save_kdbx4"]

[[example]]
name = "search_entries"
required-features = ["utilities"]

[[example]]
name = "create_db"
required-features = ["save_kdbx4"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# avoid lints that are mostly style or marginal correctness, to enable smoother contribution
bool_to_int_with_if = "allow"
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
checked_conversions = "allow"
copy_iterator = "allow"
default_trait_access = "allow"
explicit_deref_methods = "allow"
explicit_iter_loop = "allow"
explicit_into_iter_loop = "allow"
filter_map_next = "allow"
from_iter_instead_of_collect = "allow"
implicit_clone = "allow"
indexing_slicing = "allow"
inefficient_to_string = "allow"
inline_always = "allow"
into_iter_without_iter = "allow"
items_after_statements = "allow"
large_futures = "allow"
large_stack_arrays = "allow"
let_underscore_must_use = "allow"
manual_assert = "allow"
manual_let_else = "allow"
manual_range_contains = "allow"
match_same_arms = "allow"
missing_const_for_fn = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
needless_for_each = "allow"
option_if_let_else = "allow"
range_plus_one = "allow"
redundant_else = "allow"
ref_option = "allow"
return_self_not_must_use = "allow"
semicolon_if_nothing_returned = "allow"
similar_names = "allow"
single_match_else = "allow"
struct_excessive_bools = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
trivially_copy_pass_by_ref = "allow"
type_complexity = "allow"
unnecessary_wraps = "allow"
unreadable_literal = "allow"
unused_async = "allow"
used_underscore_binding = "allow"
verbose_bit_mask = "allow"
wildcard_imports = "allow"

# lints from restriction group
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
assertions_on_result_states = "warn"
dbg_macro = "warn"
error_impl_error = "warn"
exit = "warn"
expect_used = "warn"
filetype_is_file = "warn"
get_unwrap = "warn"
impl_trait_in_params = "warn"
indexing_slicing = "warn"
iter_over_hash_type = "warn"
large_include_file = "warn"
let_underscore_untyped = "warn"
lossy_float_literal = "warn"
map_err_ignore = "warn"
mem_forget = "warn"
missing_assert_message = "warn"
mixed_read_write_in_expression = "warn"
mod_module_files = "warn"
multiple_unsafe_ops_per_block = "warn"
mutex_atomic = "warn"
needless_raw_strings = "warn"
non_zero_suggestions = "warn"
panic = "warn"
panic_in_result_fn = "warn"
partial_pub_fields = "warn"
pathbuf_init_then_push = "warn"
pattern_type_mismatch = "warn"
precedence_bits = "warn"
print_stderr = "warn"
print_stdout = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_test_prefix = "warn"
renamed_function_params = "warn"
rest_pat_in_fully_bound_structs = "warn"
self_named_module_files = "warn"
shadow_reuse = "warn"
shadow_same = "warn"
shadow_unrelated = "warn"
single_char_lifetime_names = "warn"
string_add = "warn"
string_slice = "warn"
suspicious_xor_used_as_pow = "warn"
todo = "warn"
unimplemented = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unreachable = "warn"
unwrap_used = "warn"
verbose_file_reads = "warn"
